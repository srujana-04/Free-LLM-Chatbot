<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free LLM Chatbot</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-muted: #8888a0;
      --accent: #6c5ce7;
      --accent-hover: #5b4cdb;
      --user-msg: #2d2d38;
      --bot-msg: #252530;
      --radius: 12px;
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .chat-container {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 420px;
      max-height: 70vh;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--bot-msg);
      border: 1px solid var(--border);
    }
    .message .role-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.8;
      margin-bottom: 0.25rem;
    }
    .input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    #message-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    #message-input::placeholder { color: var(--text-muted); }
    #message-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .controls label { display: flex; align-items: center; gap: 0.35rem; }
    #temperature {
      width: 100px;
      height: 6px;
      accent-color: var(--accent);
    }
    #temperature-value { min-width: 2.5ch; }
    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
    .status.error { color: #e05c5c; }
    .typing {
      opacity: 0.7;
      font-style: italic;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Free LLM Chatbot</h1>
  <p class="subtitle">Ollama (local) or Hugging Face · Last 5 messages in context</p>

  <div class="chat-container">
    <div id="chat-messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="message-input"
          placeholder="Type a message..."
          rows="1"
        ></textarea>
        <button id="send-btn" type="button">Send</button>
      </div>
      <div class="controls">
        <label>
          Temperature
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
        </label>
        <span id="temperature-value">0.7</span>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    // DOM elements
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const tempSlider = document.getElementById('temperature');
    const tempValue = document.getElementById('temperature-value');
    const statusEl = document.getElementById('status');

    // In-memory conversation history (last 5 messages); also sent to backend
    let conversationHistory = [];

    // Show status message
    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    // Append a message to the chat UI
    function appendMessage(role, content) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const label = document.createElement('div');
      label.className = 'role-label';
      label.textContent = role === 'user' ? 'You' : 'Assistant';
      div.appendChild(label);
      const text = document.createElement('div');
      text.textContent = content;
      div.appendChild(text);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Show "typing" indicator
    function showTyping(show) {
      let el = document.getElementById('typing-indicator');
      if (show) {
        if (!el) {
          el = document.createElement('div');
          el.id = 'typing-indicator';
          el.className = 'message assistant typing';
          el.innerHTML = '<div class="role-label">Assistant</div><div>Thinking...</div>';
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        el.style.display = 'block';
      } else if (el) {
        el.style.display = 'none';
      }
    }

    // Send user message to backend and display reply
    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      inputEl.value = '';
      sendBtn.disabled = true;
      appendMessage('user', message);
      showTyping(true);
      setStatus('');

      const temperature = parseFloat(tempSlider.value);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            temperature: temperature,
            history: conversationHistory
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Request failed');
        }

        // Update local history from backend response (last 5 messages)
        conversationHistory = data.history || [];
        showTyping(false);
        appendMessage('assistant', data.reply);
        setStatus('Model: ' + (data.model_used || '—'));
      } catch (err) {
        showTyping(false);
        setStatus('Error: ' + (err.message || 'Could not get response'), true);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Send on button click
    sendBtn.addEventListener('click', sendMessage);

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Temperature slider label
    tempSlider.addEventListener('input', () => {
      tempValue.textContent = tempSlider.value;
    });

    // Optional: check backend health on load
    fetch('/health')
      .then(r => r.json())
      .then((data) => {
        if (data.status === 'ok') {
          setStatus('Backend: ' + (data.backend || '—') + ', model: ' + (data.model || '—'));
        } else {
          setStatus('Backend: ' + (data.ollama || data.status || 'unknown'), true);
        }
      })
      .catch(() => setStatus('Could not reach backend', true));

    inputEl.focus();
  </script>
</body>
</html>
